<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マッピング同期テスト</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #00ff00;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00dd00;
            box-shadow: 0 0 10px #00ff00;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .status-card {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
        }
        .status-card h3 {
            color: #00ff00;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
            background: #0a0a0a;
            border-left: 3px solid #444;
        }
        .status-item.active {
            border-left-color: #00ff00;
        }
        .status-item.error {
            border-left-color: #ff0000;
        }
        .value {
            color: #fff;
            font-weight: bold;
        }
        .console {
            background: #000;
            border: 1px solid #00ff00;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-entry.info { color: #0088ff; }
        .log-entry.success { color: #00ff00; }
        .log-entry.error { color: #ff0000; }
        .log-entry.warning { color: #ffff00; }
        .log-entry.debug { color: #ff00ff; }
        .test-results {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 5px;
        }
        .test-result {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: #0a0a0a;
            border-radius: 3px;
        }
        .test-result .icon {
            margin-right: 10px;
            font-size: 20px;
        }
        .test-result.pass { border-left: 3px solid #00ff00; }
        .test-result.fail { border-left: 3px solid #ff0000; }
        .test-result.pending { border-left: 3px solid #ffff00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Dropcaster マッピング同期テストツール</h1>

        <div class="controls">
            <button onclick="startTest()">📱 アプリを開く</button>
            <button onclick="openWindows()">🪟 ウィンドウを開く</button>
            <button onclick="testSourceUpdate()">📐 ソース領域テスト</button>
            <button onclick="testMappingUpdate()">🎯 マッピング位置テスト</button>
            <button onclick="runFullTest()">🧪 完全テスト実行</button>
            <button onclick="clearConsole()">🗑️ ログクリア</button>
        </div>

        <div class="status-grid">
            <div class="status-card">
                <h3>🌐 アプリケーション状態</h3>
                <div class="status-item">
                    <span>アプリウィンドウ</span>
                    <span class="value" id="app-status">未開始</span>
                </div>
                <div class="status-item">
                    <span>ソースウィンドウ</span>
                    <span class="value" id="source-status">未開始</span>
                </div>
                <div class="status-item">
                    <span>マッピングウィンドウ</span>
                    <span class="value" id="mapping-status">未開始</span>
                </div>
                <div class="status-item">
                    <span>ストリーム状態</span>
                    <span class="value" id="stream-status">未確認</span>
                </div>
            </div>

            <div class="status-card">
                <h3>📍 ソース選択領域</h3>
                <div class="status-item">
                    <span>X座標</span>
                    <span class="value" id="source-x">0</span>
                </div>
                <div class="status-item">
                    <span>Y座標</span>
                    <span class="value" id="source-y">0</span>
                </div>
                <div class="status-item">
                    <span>幅</span>
                    <span class="value" id="source-width">100</span>
                </div>
                <div class="status-item">
                    <span>高さ</span>
                    <span class="value" id="source-height">100</span>
                </div>
            </div>

            <div class="status-card">
                <h3>🎨 マッピング位置</h3>
                <div class="status-item">
                    <span>X座標</span>
                    <span class="value" id="mapping-x">25</span>
                </div>
                <div class="status-item">
                    <span>Y座標</span>
                    <span class="value" id="mapping-y">25</span>
                </div>
                <div class="status-item">
                    <span>幅</span>
                    <span class="value" id="mapping-width">50</span>
                </div>
                <div class="status-item">
                    <span>高さ</span>
                    <span class="value" id="mapping-height">50</span>
                </div>
            </div>

            <div class="status-card">
                <h3>✅ テスト結果</h3>
                <div class="status-item" id="test-dom">
                    <span>DOM要素</span>
                    <span class="value">未テスト</span>
                </div>
                <div class="status-item" id="test-stream">
                    <span>ストリーム</span>
                    <span class="value">未テスト</span>
                </div>
                <div class="status-item" id="test-sync">
                    <span>同期</span>
                    <span class="value">未テスト</span>
                </div>
                <div class="status-item" id="test-comm">
                    <span>通信</span>
                    <span class="value">未テスト</span>
                </div>
            </div>
        </div>

        <div class="test-results" id="test-results" style="display: none;">
            <h3>🧪 テスト結果詳細</h3>
            <div id="test-details"></div>
        </div>

        <div class="console" id="console"></div>
    </div>

    <script>
        let appWindow = null;
        let sourceData = { x: 0, y: 0, width: 100, height: 100 };
        let mappingData = { x: 25, y: 25, width: 50, height: 50 };
        let messageListener = null;

        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ja-JP', { 
                hour12: false, 
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                fractionalSecondDigits: 3 
            });
            entry.textContent = `[${time}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function updateStatus(id, value, isError = false) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = value;
                element.parentElement.classList.toggle('error', isError);
                element.parentElement.classList.toggle('active', !isError && value !== '未開始' && value !== '未テスト');
            }
        }

        function startTest() {
            log('アプリケーションを開いています...', 'info');
            
            if (appWindow && !appWindow.closed) {
                appWindow.focus();
                log('既存のウィンドウにフォーカス', 'info');
                return;
            }

            appWindow = window.open('http://localhost:5174', 'dropcaster', 'width=1400,height=900');
            
            if (messageListener) {
                window.removeEventListener('message', messageListener);
            }
            
            messageListener = handleMessage;
            window.addEventListener('message', messageListener);
            
            updateStatus('app-status', '開いている');
            log('アプリケーションウィンドウを開きました', 'success');
            
            // ウィンドウの状態を監視
            const checkInterval = setInterval(() => {
                if (!appWindow || appWindow.closed) {
                    updateStatus('app-status', '閉じた', true);
                    clearInterval(checkInterval);
                }
            }, 1000);
        }

        function handleMessage(event) {
            // オリジンチェック
            if (!event.origin.includes('localhost')) return;
            
            const type = event.data.type;
            if (!type) return;
            
            log(`📨 メッセージ受信: ${type}`, 'debug');
            
            switch(type) {
                case 'source-selection-change':
                    handleSourceChange(event.data.data);
                    break;
                case 'mapping-transform-change':
                    handleMappingChange(event.data.data);
                    break;
                case 'mapping-overlay-update':
                    handleOverlayUpdate(event.data.detail);
                    break;
                default:
                    log(`未知のメッセージタイプ: ${type}`, 'warning');
            }
            
            updateStatus('test-comm', 'OK');
        }

        function handleSourceChange(data) {
            sourceData = data;
            updateStatus('source-x', data.x.toFixed(1));
            updateStatus('source-y', data.y.toFixed(1));
            updateStatus('source-width', data.width.toFixed(1));
            updateStatus('source-height', data.height.toFixed(1));
            log(`ソース選択更新: X:${data.x.toFixed(1)}, Y:${data.y.toFixed(1)}, W:${data.width.toFixed(1)}, H:${data.height.toFixed(1)}`, 'success');
            checkSync();
        }

        function handleMappingChange(data) {
            mappingData = data;
            updateStatus('mapping-x', data.x.toFixed(1));
            updateStatus('mapping-y', data.y.toFixed(1));
            updateStatus('mapping-width', data.width.toFixed(1));
            updateStatus('mapping-height', data.height.toFixed(1));
            log(`マッピング位置更新: X:${data.x.toFixed(1)}, Y:${data.y.toFixed(1)}, W:${data.width.toFixed(1)}, H:${data.height.toFixed(1)}`, 'success');
            checkSync();
        }

        function handleOverlayUpdate(data) {
            log(`オーバーレイ更新イベント受信`, 'info');
            if (data) {
                log(`  ソース: ${JSON.stringify(data.source)}`, 'debug');
                log(`  マッピング: ${JSON.stringify(data.mapping)}`, 'debug');
            }
        }

        function checkSync() {
            if (!appWindow || appWindow.closed) return;
            
            try {
                const doc = appWindow.document;
                const container = doc.getElementById('iframe-mapping-container');
                const video = doc.getElementById('iframe-mapping-video');
                
                if (container) {
                    const style = appWindow.getComputedStyle(container);
                    const hasStream = video && video.srcObject;
                    
                    updateStatus('test-dom', 'OK');
                    updateStatus('stream-status', hasStream ? 'アクティブ' : '未設定', !hasStream);
                    updateStatus('test-stream', hasStream ? 'OK' : 'NG', !hasStream);
                    
                    const actual = {
                        left: style.left,
                        top: style.top,
                        width: style.width,
                        height: style.height
                    };
                    
                    const expected = {
                        left: `${mappingData.x}%`,
                        top: `${mappingData.y}%`,
                        width: `${mappingData.width}%`,
                        height: `${mappingData.height}%`
                    };
                    
                    const isSync = JSON.stringify(actual) === JSON.stringify(expected);
                    updateStatus('test-sync', isSync ? 'OK' : 'NG', !isSync);
                    
                    if (!isSync) {
                        log(`同期エラー: 期待値=${JSON.stringify(expected)}, 実際=${JSON.stringify(actual)}`, 'error');
                    } else {
                        log('✅ 同期成功', 'success');
                    }
                } else {
                    updateStatus('test-dom', 'NG', true);
                    log('iframe-mapping-containerが見つかりません', 'error');
                }
            } catch (e) {
                log(`エラー: ${e.message}`, 'error');
            }
        }

        function openWindows() {
            if (!appWindow || appWindow.closed) {
                log('先にアプリを開いてください', 'warning');
                return;
            }
            
            log('ウィンドウを開く操作をシミュレート', 'info');
            
            // アプリ内のボタンをクリック
            try {
                const btn = appWindow.document.getElementById('open-windows-btn');
                if (btn) {
                    btn.click();
                    log('ウィンドウ開くボタンをクリックしました', 'success');
                    
                    // ステータス更新
                    setTimeout(() => {
                        updateStatus('source-status', '開いている');
                        updateStatus('mapping-status', '開いている');
                        checkSync();
                    }, 2000);
                } else {
                    log('ウィンドウ開くボタンが見つかりません', 'error');
                }
            } catch (e) {
                log(`エラー: ${e.message}`, 'error');
            }
        }

        function testSourceUpdate() {
            if (!appWindow || appWindow.closed) {
                log('アプリが開いていません', 'error');
                return;
            }
            
            const testData = {
                x: Math.random() * 50,
                y: Math.random() * 50,
                width: 30 + Math.random() * 40,
                height: 30 + Math.random() * 40
            };
            
            appWindow.postMessage({
                type: 'source-selection-change',
                data: testData
            }, '*');
            
            log(`テストソース送信: ${JSON.stringify(testData)}`, 'info');
        }

        function testMappingUpdate() {
            if (!appWindow || appWindow.closed) {
                log('アプリが開いていません', 'error');
                return;
            }
            
            const testData = {
                x: Math.random() * 50,
                y: Math.random() * 50,
                width: 20 + Math.random() * 30,
                height: 20 + Math.random() * 30
            };
            
            appWindow.postMessage({
                type: 'mapping-transform-change',
                data: testData
            }, '*');
            
            log(`テストマッピング送信: ${JSON.stringify(testData)}`, 'info');
        }

        async function runFullTest() {
            log('完全テストを開始します', 'info');
            document.getElementById('test-results').style.display = 'block';
            const details = document.getElementById('test-details');
            details.innerHTML = '';
            
            const tests = [
                { name: 'アプリケーション起動', fn: () => startTest() },
                { name: 'DOM要素確認', fn: () => checkSync() },
                { name: 'ウィンドウ開く', fn: () => openWindows() },
                { name: 'ソース更新テスト', fn: () => testSourceUpdate() },
                { name: 'マッピング更新テスト', fn: () => testMappingUpdate() }
            ];
            
            for (const test of tests) {
                const result = document.createElement('div');
                result.className = 'test-result pending';
                result.innerHTML = `
                    <span class="icon">⏳</span>
                    <span>${test.name}</span>
                `;
                details.appendChild(result);
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                try {
                    test.fn();
                    result.className = 'test-result pass';
                    result.querySelector('.icon').textContent = '✅';
                    log(`${test.name}: 成功`, 'success');
                } catch (e) {
                    result.className = 'test-result fail';
                    result.querySelector('.icon').textContent = '❌';
                    log(`${test.name}: 失敗 - ${e.message}`, 'error');
                }
                
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
            
            log('完全テスト完了', 'info');
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            log('コンソールをクリアしました', 'info');
        }

        // 初期化
        log('テストツール初期化完了', 'success');
        log('「アプリを開く」ボタンをクリックして開始してください', 'info');

        // 定期的な同期チェック
        setInterval(() => {
            if (appWindow && !appWindow.closed) {
                checkSync();
            }
        }, 3000);
    </script>
</body>
</html>
