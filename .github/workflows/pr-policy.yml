# verify をタイトル・本文編集で再起動しないため、既存 pr-policy を分離する (#140)。
name: PR policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ジョブ名は既存と同じ。ブランチ保護でこのチェックを参照していても改名しない。
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR のコードは実行せず、既定ブランチの既存タイトル検査を使う。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: PR タイトルの Conventional Commits lint
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # rerun が古いタイトルを再生しないよう、現在値を API から読む。
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          export PR_TITLE
          bash scripts/check-pr-title.sh
