# verify をタイトル・本文編集で再起動しないため、既存 pr-policy を分離する (#140)。
name: PR policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ジョブ名は既存と同じ。ブランチ保護でこのチェックを参照していても改名しない。
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR のコードは実行せず、既定ブランチの既存タイトル検査を使う。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: PR タイトルの Conventional Commits lint
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # rerun が古いタイトルを再生しないよう、現在値を API から読む。
          PR_TITLE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          export PR_TITLE
          bash scripts/check-pr-title.sh

      # feat / fix / perf / 破壊的変更の PR に changelog.d/ の断片を求める (docs/decisions/0022)。
      # タイトル検査と同じく、判定は既定ブランチの scripts/release.js で行い PR のコードは実行しない。
      # ファイル一覧とラベルは API の現在値を読む (ラベルの付け外しでも走り直す)。
      - name: 変更履歴の断片
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # 断片の仕組みを入れる PR 自身では既定ブランチにまだ判定が無い
          if [ ! -f scripts/release.js ]; then
            echo "::notice::既定ブランチに scripts/release.js が無いので断片の検査を見送る"
            exit 0
          fi
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,labels)
          PR_TITLE=$(jq -r .title <<<"$pr")
          PR_LABELS=$(jq -r '.labels[].name' <<<"$pr")
          # gh pr view の files は先頭 100 件で切れるので、REST をページ送りで読む
          PR_FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          export PR_TITLE PR_FILES PR_LABELS
          node scripts/release.js check-pr
