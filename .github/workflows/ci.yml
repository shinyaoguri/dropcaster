# PR と main push でテスト・ビルドを検証する (デプロイは deploy.yml が担う)。
# npm run build / build:web はそれぞれ tsc を含むので、型チェックもここでかかる。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check node-side JS types (cli / core / scripts / tests)
        run: npm run check

      - name: Test
        run: npm test

      - name: Build viewer (user gallery)
        run: npm run build

      - name: Build hosted web app
        run: npm run build:web
