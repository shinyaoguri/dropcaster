# PR と main push でテスト・ビルドを検証する (デプロイは deploy.yml が担う)。
# npm run build / build:web はそれぞれ tsc を含むので、型チェックもここでかかる。
name: CI

on:
  pull_request:
    # edited も対象: pr-policy は PR タイトルを検査するので、タイトル修正で再検査が要る
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check node-side JS types (cli / core / scripts / tests)
        run: npm run check

      - name: Test
        run: npm test

      - name: Build viewer (user gallery)
        run: npm run build

      - name: Build hosted web app
        run: npm run build:web

      - name: Build isolated 3D projection PoC
        run: npm run build:poc

      - name: Select Chromium for projection checks
        timeout-minutes: 5
        run: |
          if projection_chromium_path="$(command -v google-chrome || command -v chromium)"; then
            printf 'CHROMIUM_PATH=%s\n' "$projection_chromium_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify CSS/GPU projection and preview lifecycle
        timeout-minutes: 5
        run: npm run test:poc

      - name: Verify projection state and source recovery (both viewer entries)
        timeout-minutes: 5
        run: npm run test:projection-runtime

      - name: Verify integrated practice and portable projects (both viewer entries)
        timeout-minutes: 10
        run: npm run test:practice

      - name: Verify existing CSS output pixels (both viewer entries)
        timeout-minutes: 5
        run: node tests/browser/mapping-css-regression.mjs

      # デプロイ経路の破損を PR 時点で検出する (#44 は CI が緑のまま deploy.yml だけが
      # 1.5 ヶ月落ち続けていた)。--dry-run は API トークン不要でバンドルまで実行する。
      - name: Dry-run deploy (Cloudflare Workers)
        working-directory: apps/web
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir="${RUNNER_TEMP}/wrangler-dry-run"

  # squash merge + squash_merge_commit_title=PR_TITLE 設定なので、PR タイトルが
  # そのまま main のコミットメッセージになる。verify とは失敗の性質が違うので別ジョブ。
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7

      - name: PR タイトルの Conventional Commits lint
        run: ./scripts/check-pr-title.sh
