name: Generate Sketch Previews

on:
  push:
    paths:
      - 'sketches/**'
  workflow_dispatch:

jobs:
  generate-previews:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps
      
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version
      
    - name: Generate sketch previews
      run: node src/core/scan-sketches.js --generate-previews
      
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/previews/
        git diff --staged --quiet || git commit -m "🎬 Update sketch previews"
        git push