# dropcaster (静的アセット + /op-cdn proxy を兼ねた 1 つの Worker) を
# main への push で Cloudflare Workers にデプロイする。
#
# 必須 secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    "Edit Cloudflare Workers" 権限を持つ API トークン。
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare Dashboard 右サイドバーの Account ID。
#
# デプロイ先: https://dropcaster.<workers-subdomain>.workers.dev
# カスタムドメイン (dropcaster.soui.dev) は wrangler.toml の [[routes]] を
# 有効化するか、Cloudflare Dashboard で手動 attach する。

name: Deploy dropcaster

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'src/viewer/**'
      - 'src/core/modules/**'
      # SW はテンプレから sync-sw.js / stamp-sw-version.js 経由で dist に入るので、
      # テンプレだけの変更でもデプロイを走らせる
      - 'src/cli/utils/sw-template.js'
      - 'scripts/sync-sw.js'
      - 'scripts/stamp-sw-version.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck viewer
        run: npx tsc --noEmit

      - name: Typecheck worker
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Build static site
        run: npm run build:web

      - name: Deploy via wrangler
        # wrangler は devDependency として lockfile で固定してあるので、npm ci で入った
        # ものをそのまま使う。cloudflare/wrangler-action は自前で `npm i wrangler@4` を
        # 実行して最新版を引くため、wrangler の peerOptional (@cloudflare/workers-types)
        # が上がるたびに ERESOLVE でデプロイが落ちていた (#44)。直接呼べば CI の
        # dry-run とも同じ版になり、版上げは dependabot PR 経由で CI にかかる。
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
