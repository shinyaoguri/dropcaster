name: Task
description: 個人開発タスク（機能追加・修正・調査・Epic）
title: "[type][area] 変更の要約"
labels: []
assignees: []

body:
  - type: dropdown
    id: type
    attributes:
      label: 種別 (Type)
      options:
        - feature
        - bug
        - chore
        - docs
        - experiment
        - design
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象領域 (Area)
      options:
        - viewer
        - cli
        - core
        - pwa
        - hosted
        - docs
        - infra
        - other
    validations:
      required: true

  - type: input
    id: goal
    attributes:
      label: 目的
      description: なぜこれをやるのか？達成すると何が変わるのか？
      placeholder: 例）出力を削除しても残った出力の投影位置を保つ
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 具体例・変更前後
      description: 起票時は未確定でもよい。実装前に、入力・操作、現在と期待する結果、対処・代償を最低1例書く。仮説・想定と実測を区別する。
      placeholder: "例）出力を3台追加して左端を削除 → 空きが残る → 残る2台を詰め、出力から見た映像の位置を保つ"
    validations:
      required: false

  - type: checkboxes
    id: epic
    attributes:
      label: これはEpic（親タスク）ですか？
      options:
        - label: はい（子タスクに分解し、必要に応じて別Issue化します）
          required: false

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 起票時は未確定でもよい。実装前に、観察できる結果と確かめ方を書き、現行コードと突き合わせる。
      placeholder: |
        - [ ] 左端を削除すると残る2台が詰まり、各出力上のmapping/maskの相対位置が変わらない
        - [ ] gallery / hosted の実操作と回帰テストで確認できる
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 証跡・未確認範囲
      description: 見た目は画像、動きは動画。対象版・入力・環境・実測か想定かを添える。なければ理由と未確認事項を書く。
      placeholder: "画像・動画URL / 証跡なし: 理由。外部ディスプレイは未確認、など。"
    validations:
      required: false

  - type: textarea
    id: decisions
    attributes:
      label: 判断事項・依存関係
      description: 未合意の仕様・互換性・権限の選択は、選択肢と推奨を示す。前提タスクは blocked by、工程は sub-issue で関連付ける。
      placeholder: "人が判断すること: なし / 選択肢・推奨・未実装の範囲。前提Issue: #N"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度（Priority）
      description: 相対優先度で指定（スケジュールはProject側で管理）
      options:
        - P0（最優先／先にやる）
        - P1（次にやる）
        - P2（後回し可）
        - P3（いつかやる）
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: 作業規模（Effort）
      options:
        - 1（<1時間）
        - 2（半日以内）
        - 3（1日以内）
        - 5（2〜3日）
        - 8（4日以上・要分割）
    validations:
      required: true

  - type: input
    id: links
    attributes:
      label: 参照リンク
      description: 関連Issue/PR/仕様URL（複数ある場合は半角スペース区切り）
      placeholder: "#123 https://example.com/spec"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: メモ・補足
      description: 設計メモ・懸念点・試したこと・スクショ等
    validations:
      required: false
